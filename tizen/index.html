<!doctype html>
<meta charset="utf-8">
<title>Ludoteca</title>
<body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#111;color:#eee;font:36px sans-serif;text-align:center">
<p id="message">Conectando à Ludoteca...</p>
<script>
// Tizen shell: waits for the server to answer, then opens Ludoteca fullscreen.
// The content comes from the server, so updating games does not require reinstalling the app.
// ponytail: fixed address. If the PC's IP changes, reserve the IP on the router or edit it here and reinstall.
var SERVER = 'http://192.168.1.10:3000/';

function retry() {
  // no-cors is enough: we only want to know whether the server is up (the response is opaque, a network error rejects)
  fetch(SERVER, { mode: 'no-cors', cache: 'no-store' }).then(
    function () { location.replace(SERVER); },
    function () {
      document.getElementById('message').textContent = 'Servidor da Ludoteca não encontrado em ' + SERVER + '. Tentando de novo...';
      setTimeout(retry, 2000);
    }
  );
}
retry();

// Remote's Back key (10009) closes the app while it waits for the server.
document.addEventListener('keydown', function (e) {
  if (e.keyCode === 10009 && window.tizen) tizen.application.getCurrentApplication().exit();
});
</script>
