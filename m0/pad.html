<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludoteca M0 - Controle</title>
<body style="margin:0;padding:16px;background:#111;color:#eee;font:20px sans-serif;text-align:center">
<p id="st">procurando TVs...</p>
<div id="tvs"></div>
<button id="b" style="display:none;width:100%;height:55vh;font-size:48px;border:0;border-radius:24px;background:#3b82f6;color:#fff">TOCAR</button>
<p id="r"></p>
<script>
// Dois jeitos de chegar numa TV:
//  - /pad          -> lista as TVs da mesma rede; se só há uma, entra nela direto.
//  - /pad?r=<sala> -> veio do QR da TV, entra direto.
// Primeira vez a TV precisa aceitar; depois o token em localStorage reconecta sozinho.
// RTT = celular -> servidor -> TV -> servidor -> celular, medido no mesmo relógio.
var $ = function (i) { return document.getElementById(i); };
var room = new URLSearchParams(location.search).get('r');
var ws, parou = false, rtts = [];

function getTok() { try { return localStorage.getItem('ludoteca:' + room) || ''; } catch (e) { return ''; } }

function escolher(tv) {
  room = tv.r;
  $('tvs').innerHTML = '';
  $('st').textContent = 'Conectando a TV ' + tv.name + '...';
  ws.onclose = null; ws.close();
  conn();
}

function lista(list) {
  $('tvs').innerHTML = '';
  if (!list.length) { $('st').textContent = 'Nenhuma TV encontrada. Abra o Ludoteca na TV.'; return; }
  if (list.length === 1) return escolher(list[0]); // só uma TV: a única ação é o OK nela
  $('st').textContent = 'Em qual TV?';
  list.forEach(function (tv) {
    var b = document.createElement('button');
    b.textContent = tv.name;
    b.style.cssText = 'display:block;width:100%;margin:12px 0;padding:28px;font-size:36px;border:0;border-radius:20px;background:#3b82f6;color:#fff';
    b.onclick = function () { escolher(tv); };
    $('tvs').appendChild(b);
  });
}

function conn() {
  var tok = room ? getTok() : '';
  ws = new WebSocket('ws://' + location.host + '/ws?' + (room ? 'r=' + encodeURIComponent(room) + (tok ? '&k=' + tok : '') : 'browse'));
  ws.onclose = function () { if (!parou) { $('b').style.display = 'none'; setTimeout(conn, 1000); } };
  ws.onmessage = function (e) {
    var m = JSON.parse(e.data);
    if (m.t === 'tvs') lista(m.list);
    else if (m.t === 'wait') $('st').textContent = 'Aguardando a TV aceitar...';
    else if (m.t === 'ok') {
      try { localStorage.setItem('ludoteca:' + room, m.token); } catch (e2) {}
      $('st').textContent = 'conectado'; $('b').style.display = 'block';
    } else if (m.t === 'no') {
      parou = true; $('b').style.display = 'none';
      $('st').textContent = 'Não foi possível entrar. Abra o Ludoteca de novo.';
    } else if (m.t === 'ack') {
      var r = Date.now() - m.ts;
      rtts.push(r);
      var soma = rtts.reduce(function (a, b) { return a + b; }, 0);
      $('r').textContent = 'ultimo ' + r + ' ms | media ' + Math.round(soma / rtts.length) +
        ' ms | max ' + Math.max.apply(null, rtts) + ' ms | ' + rtts.length + ' toques';
    }
  };
}
conn();

$('b').onclick = function () {
  if (ws.readyState === 1) ws.send(JSON.stringify({ t: 'tap', ts: Date.now() }));
};
</script>
